[project]
name = "inquiry-box"
version = "0.1.0"
description = "1권 12장 예제: 고객 문의함을 읽고 답장 초안을 저장하는 MCP 서버"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
